plugins {
    id 'com.android.application'
}

android {
    namespace 'com.poc.silentsms'
    compileSdk 34

    defaultConfig {
        applicationId "com.poc.silentsms"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
