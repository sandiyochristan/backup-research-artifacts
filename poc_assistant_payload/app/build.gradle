plugins {
    id 'com.android.application'
}

android {
    namespace 'com.poc.assistantpayload'
    compileSdk 34

    defaultConfig {
        applicationId "com.poc.assistantpayload"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
}
